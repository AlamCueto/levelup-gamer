spring.application.name=tienda-api

# Base de datos H2 en memoria. Los datos se reinician cada vez que se
# levanta la API: DatosIniciales vuelve a cargar los 8 productos.
spring.datasource.url=jdbc:h2:mem:tienda

# Evita mantener abierta la conexión a la base mientras se arma la respuesta.
spring.jpa.open-in-view=false

server.port=8081